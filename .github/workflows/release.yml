name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generate app icons if they aren't committed
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/icons/icon.ico)) { npm run tauri icon app-icon.png }
      - run: npm run tauri build
      - name: Checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $files = Get-ChildItem $dir -Filter *-setup.exe
          if (-not $files) { throw "No installer was produced" }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content "$dir/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: deskforge-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          generate_release_notes: true
