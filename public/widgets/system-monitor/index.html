<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>System monitor</title>
  <link rel="stylesheet" href="../../sdk/deskforge-widget.css">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <p><strong id="cpu" class="big" data-df-layout="cpu" data-df-layout-label="Processor value" data-df-layout-kind="text">–</strong> <span class="muted" data-df-layout="cpu-label" data-df-layout-label="Processor label" data-df-layout-kind="text">processor</span></p>
  <svg viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true" data-df-layout="chart" data-df-layout-label="Processor chart" data-df-layout-kind="visual"><polyline id="line" points=""/></svg>
  <p class="muted"><span data-df-layout="memory-label" data-df-layout-label="Memory label" data-df-layout-kind="text">Memory:</span> <span id="mem" data-df-layout="memory-value" data-df-layout-label="Memory value" data-df-layout-kind="text">–</span></p>
  <script src="../../sdk/deskforge-sdk.js"></script>
  <script src="widget.js"></script>
</body>
</html>
